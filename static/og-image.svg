<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fafafa"/>
            <stop offset="100%" stop-color="#f2f2f2"/>
        </linearGradient>
        <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0066ff"/>
            <stop offset="100%" stop-color="#0052cc"/>
        </linearGradient>
        <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
            <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#0a0a0a" stroke-width="0.5" opacity="0.06"/>
        </pattern>
    </defs>

    <rect width="1200" height="630" fill="url(#bg)"/>
    <rect width="1200" height="630" fill="url(#grid)"/>

    <!-- Logo mark -->
    <rect x="80" y="80" width="64" height="64" rx="16" fill="#0a0a0a"/>
    <path d="M99 102 H125 V110 H116 V126 H108 V110 H99 Z" fill="#ffffff"/>

    <!-- Brand text -->
    <text x="164" y="122"
          font-family="-apple-system, BlinkMacSystemFont, Inter, Segoe UI, Arial, sans-serif"
          font-size="30" font-weight="700" fill="#0a0a0a"
          letter-spacing="-1">TineTech</text>

    <!-- Eyebrow -->
    <text x="80" y="290"
          font-family="-apple-system, BlinkMacSystemFont, Inter, Segoe UI, Arial, sans-serif"
          font-size="16" font-weight="600" fill="#0066ff"
          letter-spacing="4">WEBSITES · WEB APPS</text>

    <!-- Headline -->
    <text x="80" y="400"
          font-family="-apple-system, BlinkMacSystemFont, Inter, Segoe UI, Arial, sans-serif"
          font-size="88" font-weight="800" fill="#0a0a0a"
          letter-spacing="-4">Build what's next.</text>

    <!-- Subheadline -->
    <text x="80" y="470"
          font-family="-apple-system, BlinkMacSystemFont, Inter, Segoe UI, Arial, sans-serif"
          font-size="26" font-weight="400" fill="#6b6b70"
          letter-spacing="-0.5">Fast, clean digital products for growing businesses.</text>

    <!-- Bottom rule -->
    <line x1="80" y1="540" x2="1120" y2="540" stroke="#0a0a0a" stroke-width="1" opacity="0.12"/>

    <!-- Bottom row -->
    <text x="80" y="580"
          font-family="-apple-system, BlinkMacSystemFont, Inter, Segoe UI, Arial, sans-serif"
          font-size="16" font-weight="600" fill="#8e8e93"
          letter-spacing="3">TINETECH · BUILT WITH PURPOSE</text>

    <!-- Accent dot -->
    <circle cx="1120" cy="565" r="8" fill="url(#acc)"/>
</svg>